# 0.1.0 Local base app with no nats
# 0.1.1 Nats connection no algorithm
# 0.1.2 Remote scheduler algorithm with nats, only 1st junction
# 0.1.3 All junctions using the algorithm
# 0.1.4 JSON libraries
# 0.1.5 Light publishing and start dashboard
# 0.1.6 Algorithm

apiVersion: datasance.com/v3
kind: Application

metadata:
  name: traffic-use-case-cluster
  namespace: remote-cp

spec:
  natsConfig:
    natsAccess: true
    natsRule: default-account

  microservices:
    - name: traffic-dashboard
      agent:
        name: ops-b
      images:
        catalogId: 8
      rebuild: true
      natsConfig:
        natsAccess: true
        natsRule: default-user
      container:
        env:
          - key: NATS_URL
            value: "nats://nats.default.svc.bridge.local:4222"
          - key: STATE_SUBJECT
            value: "traffic.state.>"
        ports:
          - internal: 8080
            external: 8084

    - name: traffic-scheduler
      agent:
        name: ops-b
      images:
        catalogId: 7
      rebuild: true
      natsConfig:
        natsAccess: true
        natsRule: default-user
      container:
        env:
          - key: OBSERVATION_SUBJECT
            value: "traffic.observation.*"
          - key: LIGHT_STATE_SUBJECT
            value: "traffic.state.*"
          - key: COMMAND_SUBJECT_PREFIX
            value: "traffic.command"
          - key: NATS_URL
            value: "nats://nats.default.svc.bridge.local:4222"

    - name: traffic-generator
      agent:
        name: site-a
      images:
        catalogId: 10
      rebuild: true
      natsConfig:
        natsAccess: true
        natsRule: default-user
      container:
        env:
          - key: NATS_URL
            value: "nats://nats.default.svc.bridge.local:4222"
          - key: GENERATION_SUBJECT
            value: "traffic.generation"
          - key: STATE_SUBJECT
            value: "traffic.state.>"

    - name: traffic-observer-1
      agent:
        name: site-a
      images:
        catalogId: 6
      rebuild: true
      natsConfig:
        natsAccess: true
        natsRule: default-user
      container:
        env:
          - key: OBSERVER_ID
            value: "1"
          - key: GENERATION_SUBJECT
            value: "traffic.generation.1"
          - key: OBSERVATION_SUBJECT
            value: "traffic.observation.1"
          - key: NATS_URL
            value: "nats://nats.default.svc.bridge.local:4222"

    - name: traffic-light-1
      agent:
        name: site-a
      images:
        catalogId: 9
      rebuild: true
      natsConfig:
        natsAccess: true
        natsRule: default-user
      container:
        env:
          - key: LIGHT_ID
            value: "1"
          - key: COMMAND_SUBJECT
            value: "traffic.command.1"
          - key: STATE_SUBJECT
            value: "traffic.state.1"
          - key: NATS_URL
            value: "nats://nats.default.svc.bridge.local:4222"    

    - name: traffic-observer-2
      agent:
        name: ops-b
      images:
        catalogId: 6
      rebuild: true
      natsConfig:
        natsAccess: true
        natsRule: default-user
      container:
        env:
          - key: OBSERVER_ID
            value: "2"
          - key: GENERATION_SUBJECT
            value: "traffic.generation.2"
          - key: OBSERVATION_SUBJECT
            value: "traffic.observation.2"
          - key: NATS_URL
            value: "nats://nats.default.svc.bridge.local:4222"

    - name: traffic-light-2
      agent:
        name: ops-b
      images:
        catalogId: 9
      rebuild: true
      natsConfig:
        natsAccess: true
        natsRule: default-user
      container:
        env:
          - key: LIGHT_ID
            value: "2"
          - key: COMMAND_SUBJECT
            value: "traffic.command.2"
          - key: STATE_SUBJECT
            value: "traffic.state.2"
          - key: NATS_URL
            value: "nats://nats.default.svc.bridge.local:4222"

    - name: traffic-observer-3
      agent:
        name: edge-c
      images:
        catalogId: 6
      rebuild: true
      natsConfig:
        natsAccess: true
        natsRule: default-user
      container:
        env:
          - key: OBSERVER_ID
            value: "3"
          - key: GENERATION_SUBJECT
            value: "traffic.generation.3"
          - key: OBSERVATION_SUBJECT
            value: "traffic.observation.3"
          - key: NATS_URL
            value: "nats://nats.default.svc.bridge.local:4222"

    - name: traffic-light-3
      agent:
        name: edge-c
      images:
        catalogId: 9
      rebuild: true
      natsConfig:
        natsAccess: true
        natsRule: default-user
      container:
        env:
          - key: LIGHT_ID
            value: "3"
          - key: COMMAND_SUBJECT
            value: "traffic.command.3"
          - key: STATE_SUBJECT
            value: "traffic.state.3"
          - key: NATS_URL
            value: "nats://nats.default.svc.bridge.local:4222"